<!doctype html>
<html lang="en" class="h-full antialiased">
  <head>
    <meta charset="UTF-8" />
    <!-- The PNG is for browsers that can't show SVG icons; the rest use the SVG. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gify</title>
    <meta
      name="description"
      content="Pick the best part of any video and make it loop. Free, and your video never leaves your device."
    />
    <link rel="canonical" href="https://gify.busayolawumi.dev/" />
    <!-- Colours the browser's bars on phones to match the page. -->
    <meta
      name="theme-color"
      content="#ffffff"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#09090b"
      media="(prefers-color-scheme: dark)"
    />

    <!-- The preview card shown when the link is shared. X reads these too. -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://gify.busayolawumi.dev/" />
    <meta property="og:site_name" content="Gify" />
    <meta property="og:title" content="Gify" />
    <meta
      property="og:description"
      content="Pick the best part of any video and make it loop. Free, and your video never leaves your device."
    />
    <meta
      property="og:image"
      content="https://gify.busayolawumi.dev/og-image.png"
    />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Gify: Videos, GIF’d. Pick the best part of any video and make it loop."
    />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body
    class="flex min-h-full flex-col bg-white font-sans text-zinc-900 dark:bg-zinc-950 dark:text-zinc-100"
  >
    <div id="root" class="flex flex-1 flex-col"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
